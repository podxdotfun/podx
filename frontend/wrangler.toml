[pages]
compatibility_date = "2024-03-26"
compatibility_flags = ["nodejs_compat"]

[pages.build]
command = "npm run pages:build"

[pages.build.upload]
format = "service-worker"

[build]
command = "npm run pages:build"
cwd = "frontend"
watch_dir = "frontend"

[build.upload]
format = "service-worker"

[[build.upload.rules]]
type = "CompiledWorker"
globs = ["**/*.js"]
fallthrough = true

[site]
bucket = ".vercel/output/static"

[env.production]
name = "podx-production"
node_compat = true

[env.preview]
name = "podx-preview"
node_compat = true

[compatibility_flags]
nodejs_compat = true 